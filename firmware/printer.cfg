# MTG card sorter: Klipper config for BIGTREETECH Manta M4P + CB1.
# X (belt) moves the head left-right. Z (lead screw) moves it up-down.
# Z = 0 is the floor of the source tray. Z homes UP, to a switch at the top.
# The numbers you tune are in [gcode_macro SETTINGS] near the bottom.
# Wiring: see wiring.md. Setup and first tests: see README.md.

[mcu]
serial: /dev/serial/by-id/REPLACE_ME
# ^ Replace with the output of: ls /dev/serial/by-id/

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 40
max_z_accel: 500

# Motor in X_DRIVER, switch in X_STOP.
[stepper_x]
step_pin: PC6
dir_pin: PA14
enable_pin: !PC7
microsteps: 16
rotation_distance: 40
# 40 = 20-tooth pulley x 2 mm per belt tooth
endstop_pin: ^PC0
position_endstop: 0
position_max: 300
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.8

# Not a real axis. Klipper requires a Y; nothing is plugged into Y_DRIVER or Y_STOP.
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 1

# Motor in Z_DRIVER, switch in Z_STOP (mounted at the TOP of Z travel).
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
# 8 = T8x8 lead screw moves 8 mm per turn
endstop_pin: ^PC2
position_endstop: 60
position_max: 60
position_min: -2
homing_positive_dir: true
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC9
run_current: 0.8

# Touch switch behind the suction cup, on the BLTOUCH header (PC14 + GND).
# PROBE moves Z down until this switch trips: the cup is pressing on the top card.
[probe]
pin: ^PC14
z_offset: 0
speed: 10
lift_speed: 20
samples: 1

# Vacuum pump on FAN1. SET_PIN PIN=pump VALUE=1 turns it on, VALUE=0 off.
[output_pin pump]
pin: PD3
value: 0
shutdown_value: 0

# G28 homes Z (up) first so the head clears the bins, then X. Y is marked homed without moving.
# It also forgets the remembered stack height, so refill the tray, then G28.
[homing_override]
axes: xyz
set_position_y: 0
gcode:
  G28 Z
  G28 X
  SET_GCODE_VARIABLE MACRO=SETTINGS VARIABLE=top_z VALUE={printer["gcode_macro SETTINGS"].travel_z}

# If nothing happens for 2 minutes: pump off, motors off.
[idle_timeout]
timeout: 120
gcode:
  SET_PIN PIN=pump VALUE=0
  M84

# Needed by the Mainsail web page.
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[respond]

#####################################################################
# Settings: change these, then press SAVE & RESTART in Mainsail.
# Positions in mm. Speeds in mm/s. Times in ms (1000 ms = 1 s).
#####################################################################

[gcode_macro SETTINGS]
variable_source_x: 150
variable_bin_a_x: 0
variable_bin_b_x: 300
variable_travel_z: 45
# ^ height of the cup while moving sideways; must clear the 40 mm tray and bin walls
variable_x_speed: 150
variable_z_speed: 40
variable_dwell_ms: 300
# ^ pump on, then wait this long before lifting
variable_peel_mm: 5
variable_peel_speed: 5
# ^ how fast the first 5 mm of lift is. The main thing you test (SPEC section 8).
variable_release_ms: 500
# ^ pump off, then wait this long for the card to drop
variable_top_z: 45
# ^ not a setting: remembers the stack height between cycles so PICK can skip ahead
gcode:

#####################################################################
# Commands. Type these in the Mainsail console.
#####################################################################

[gcode_macro PICK]
description: Pick up one card from the source stack
gcode:
  {% set s = printer["gcode_macro SETTINGS"] %}
  G90
  G1 Z{s.travel_z} F{s.z_speed * 60}
  G1 X{s.source_x} F{s.x_speed * 60}
  G1 Z{[s.top_z + 3, s.travel_z]|min} F{s.z_speed * 60}
  PROBE
  _REMEMBER_TOP
  SET_PIN PIN=pump VALUE=1
  G4 P{s.dwell_ms}
  G91
  G1 Z{s.peel_mm} F{s.peel_speed * 60}
  G90
  G1 Z{s.travel_z} F{s.z_speed * 60}

[gcode_macro _REMEMBER_TOP]
gcode:
  SET_GCODE_VARIABLE MACRO=SETTINGS VARIABLE=top_z VALUE={printer.probe.last_probe_position.z}

[gcode_macro PLACE]
description: Carry the held card to a bin and drop it. Usage: PLACE BIN=A
gcode:
  {% set s = printer["gcode_macro SETTINGS"] %}
  {% set bin = params.BIN|default("A")|upper %}
  {% if bin not in ["A", "B"] %}
    {action_raise_error("BIN must be A or B")}
  {% endif %}
  {% set x = s.bin_a_x if bin == "A" else s.bin_b_x %}
  G90
  G1 Z{s.travel_z} F{s.z_speed * 60}
  G1 X{x} F{s.x_speed * 60}
  SET_PIN PIN=pump VALUE=0
  G4 P{s.release_ms}

[gcode_macro SORT_RUN]
description: Move N cards, alternating bins A and B. Usage: SORT_RUN N=100
gcode:
  {% set s = printer["gcode_macro SETTINGS"] %}
  {% set n = params.N|default(100)|int %}
  G28
  {% for i in range(n) %}
    RESPOND MSG="cycle {i + 1} of {n}"
    PICK
    PLACE BIN={"A" if i % 2 == 0 else "B"}
  {% endfor %}
  G1 X{s.source_x} F{s.x_speed * 60}
  RESPOND MSG="done: {n} cycles at peel_speed {s.peel_speed} mm/s"
